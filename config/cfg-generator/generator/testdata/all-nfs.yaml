    reportCaller: false # enable the caller report or not, value: true or false
ausf:
  info:
    version: 1.0.3
    description: AUSF initial local configuration

  configuration:
    idleTimeout: 60s # HTTP server idle timeout; 0s disables it
    readIdleTimeout: 60s # HTTP/2 client idle time before sending a health-check ping; 0s disables it
    pingTimeout: 15s # HTTP/2 health-check ping response timeout; 0s uses the transport default
    sbi: # Service-based interface information
      scheme: http # the protocol for sbi (http or https)
      registerIPv4: 127.0.0.9 # IP used to register to NRF
      bindingIPv4: 127.0.0.9  # IP used to bind the service
      port: 8000 # Port used to bind the service
      tls: # the local path of TLS key
        verify: false # Verify outgoing SBI HTTPS certificates
        pem: cert/ausf.pem # AUSF TLS Certificate
        key: cert/ausf.key # AUSF TLS Private key
    serviceNameList: # the SBI services provided by this AUSF, refer to TS 29.509
      - nausf-auth # Nausf_UEAuthentication service
    nrfUri: http://127.0.0.10:8000 # a valid URI of NRF
    nrfCertPem: cert/nrf.pem # NRF Certificate
    plmnSupportList: # the PLMNs (Public Land Mobile Network) list supported by this AUSF
      - mcc: 208 # Mobile Country Code (3 digits string, digit: 0~9)
        mnc: 93  # Mobile Network Code (2 or 3 digits string, digit: 0~9)
      - mcc: 123 # Mobile Country Code (3 digits string, digit: 0~9)
        mnc: 45  # Mobile Network Code (2 or 3 digits string, digit: 0~9)
    groupId: ausfGroup001 # ID for the group of the AUSF
    eapAkaSupiImsiPrefix: false # including "imsi-" prefix or not when using the SUPI to do EAP-AKA' authentication

  logger: # log output setting
    enable: true # true or false
    level: info # how detailed to output, value: trace, debug, info, warn, error, fatal, panic
    reportCaller: false # enable the caller report or not, value: true or false
chf:
  info:
    version: 1.0.3
    description: CHF initial local configuration

  configuration:
    idleTimeout: 60s # HTTP server idle timeout; 0s disables it
    readIdleTimeout: 60s # HTTP/2 client idle time before sending a health-check ping; 0s disables it
    pingTimeout: 15s # HTTP/2 health-check ping response timeout; 0s uses the transport default
    chfName: CHF # the name of this CHF
    sbi: # Service-based interface information
      scheme: http # the protocol for sbi (http or https)
      registerIPv4: 127.0.0.113 # IP used to register to NRF
      bindingIPv4: 127.0.0.113 # IP used to bind the service
      port: 8000 # port used to bind the service
      tls: # the local path of TLS key
        verify: false # Verify outgoing SBI HTTPS certificates
        pem: cert/chf.pem # CHF TLS Certificate
        key: cert/chf.key # CHF TLS Private key
    nrfUri: http://127.0.0.10:8000 # a valid URI of NRF
    nrfCertPem: cert/nrf.pem # NRF Certificate
    serviceNameList: # the SBI services provided by this CHF, refer to TS 32.291
      - nchf-convergedcharging # Nchf_ConvergedCharging service
    mongodb: # the mongodb connected by this CHF
      name: free5gc # name of the mongodb
      url: mongodb://localhost:27017 # a valid URL of the mongodb
    quotaValidityTime: 10000
    volumeLimit: 50000
    volumeLimitPDU: 10000
    volumeThresholdRate: 0.8
    cgf:
      enable: true
      hostIPv4: 127.0.0.1 # billing server ftp server
      port: 2121 # billing server listen on port 2121
      listenPort: 2122 # cgf ftp server listen port
      passiveTransferPortRange: # Range of ports used for passive FTP data transfer connections
        start: 2123 # Starting port number for passive mode data connections
        end: 2130 # Ending port number for passive mode data connections
      tls:
        pem: cert/chf.pem
        key: cert/chf.key
      cdrFilePath: /tmp
    abmfDiameter:
      protocol: tcp
      hostIPv4: 127.0.0.113
      port: 3868
      tls:
        pem: cert/chf.pem
        key: cert/chf.key
    rfDiameter:
      protocol: tcp
      hostIPv4: 127.0.0.113
      port: 3869
      tls:
        pem: cert/chf.pem # CHF TLS Certificate
        key: cert/chf.key # CHF TLS Private key
  logger: # log output setting
    enable: true # true or false
    level: info # how detailed to output, value: trace, debug, info, warn, error, fatal, panic
    reportCaller: false # enable the caller report or not, value: true or false
nef:
  info:
    version: 1.0.1
    description: NEF initial local configuration

  configuration:
    idleTimeout: 60s # HTTP server idle timeout; 0s disables it
    readIdleTimeout: 60s # HTTP/2 client idle time before sending a health-check ping; 0s disables it
    pingTimeout: 15s # HTTP/2 health-check ping response timeout; 0s uses the transport default
    sbi:
      scheme: http # The protocol for sbi (http or https)
      registerIPv4: 127.0.0.5 # IP used to register to NRF
      bindingIPv4: 127.0.0.5 # IP used to bind the service
      port: 8000 # port used to bind the service
      tls: # the local path of TLS key
        verify: false # Verify outgoing SBI HTTPS certificates
        pem: cert/nef.pem # NEF TLS Certificate
        key: cert/nef.key # NEF TLS Private key
    nrfUri: http://127.0.0.10:8000 # A valid URI of NRF
    nrfCertPem: cert/nrf.pem # NRF Certificate
    serviceList: # the SBI services provided by this NEF
      - serviceName: nnef-pfdmanagement # Nnef_PFDManagement Service (also mounts /3gpp-pfd-management)
      - serviceName: nnef-oam # OAM service
      - serviceName: 3gpp-traffic-influence # AF-facing Traffic Influence API
      - serviceName: nnef-callback # Inbound SMF event notification callback

  logger: # log output setting
    enable: true # true or false
    level: info # how detailed to output, value: trace, debug, info, warn, error, fatal, panic
    reportCaller: false # enable the caller report or not, value: true or false
scp:
  info:
    version: 1.0.1
