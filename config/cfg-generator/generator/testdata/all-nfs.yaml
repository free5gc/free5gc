# All 15 NF blocks copied verbatim from free5gc config/<nf>cfg.yaml
# (free5gc main aab3d81), indented under their NF key. webui is not
# included: the webconsole submodule is not checked out.
# Tests prepend a `global:` block to build an integrated input file.
upf:
  version: 1.0.3
  description: UPF initial local configuration

  # PFCP Configuration
  # The listen IP and nodeID of the N4 interface on this UPF (Can't set to 0.0.0.0)
  pfcp:
    addr: 127.0.0.8   # IP addr for listening
    nodeID: 127.0.0.8 # External IP or FQDN can be reached
    retransTimeout: 1s # retransmission timeout
    maxRetrans: 3 # the max number of retransmission

  # GTP-U Configuration
  gtpu:
    forwarder: gtp5g
    # The IP list of the N3/N9 interfaces on this UPF
    # You can bind this to a specific IP from your available subnets (e.g., 10.10.0.1).
    # Alternatively, you can bind it to all interfaces using 0.0.0.0.
    # If you bind to a specific IP, ensure SMF uses the same IP in its N3 configuration.
    # If you bind to all (0.0.0.0), SMF can use any of the available UPF IPs, but do not use 0.0.0.0 in SMF.
    ifList:
      - addr: 127.0.0.8
        type: N3
        # name: upf.5gc.nctu.me
        # ifname: gtpif
        # mtu: 1400

  # Supported DNNs
  # List of Data Network Names (DNN) supported by this UPF.
  dnnList:
    - dnn: internet # Data Network Name
      cidr: 10.60.0.0/16 # Classless Inter-Domain Routing for assigned IPv4 pool of UE
      # Optional NAT interface in the UPF network namespace; takes precedence over natIfCIDR.
      # natifname: eth0
      # natIfCIDR: 192.168.0.0/24 # Select the NAT interface by its subnet; adapt to your deployment
      ipForwardEnable: true # Add FORWARD rules when natifname or natIfCIDR is set
      # tcpMss: 1400 # Optional fixed TCP MSS; omit or set 0 to clamp MSS to PMTU
    - dnn: internet # Data Network Name
      cidr: 10.61.0.0/16 # Classless Inter-Domain Routing for assigned IPv4 pool of UE
      # Optional NAT interface in the UPF network namespace; takes precedence over natIfCIDR.
      # natifname: eth0
      # natIfCIDR: 192.168.0.0/24 # Select the NAT interface by its subnet; adapt to your deployment
      ipForwardEnable: true # Add FORWARD rules when natifname or natIfCIDR is set
      # tcpMss: 1400 # Optional fixed TCP MSS; omit or set 0 to clamp MSS to PMTU

  # Logging Configuration
  # Controls logging level and output for the UPF.
  logger:
    enable: true # true or false
    level: info # how detailed to output, value: trace, debug, info, warn, error, fatal, panic
    reportCaller: false # enable the caller report or not, value: true or false

  ees:
    enabled: false # true or false; free5GC single-UPF only, keep false with ULCL
    ip: 127.0.0.8  # IP used to bind the Nupf_EventExposure service
    port: 8088     # Port used to bind the service
nrf:
  info:
    version: 1.0.2
    description: NRF initial local configuration

  configuration:
    idleTimeout: 60s # HTTP server idle timeout; 0s disables it
    readIdleTimeout: 60s # HTTP/2 client idle time before sending a health-check ping; 0s disables it
    pingTimeout: 15s # HTTP/2 health-check ping response timeout; 0s uses the transport default
    MongoDBName: free5gc # database name in MongoDB
    MongoDBUrl: mongodb://127.0.0.1:27017 # a valid URL of the mongodb
    sbi: # Service-based interface information
      scheme: http # the protocol for sbi (http or https)
      registerIPv4: 127.0.0.10 # IP used to serve NFs or register to another NRF
      bindingIPv4: 127.0.0.10  # IP used to bind the service
      port: 8000 # port used to bind the service
      cert: # the local path of TLS key
        verify: false # Verify outgoing SBI HTTPS certificates
        pem: cert/nrf.pem # NRF TLS Certificate
        key: cert/nrf.key # NRF TLS Private key
      rootcert: # the local path of root CA certs
        pem: cert/root.pem
        key: cert/root.key
      oauth: true
    DefaultPlmnId:
      mcc: 208 # Mobile Country Code (3 digits string, digit: 0~9)
      mnc: 93 # Mobile Network Code (2 or 3 digits string, digit: 0~9)
    serviceNameList: # the SBI services provided by this NRF, refer to TS 29.510
      - nnrf-nfm # Nnrf_NFManagement service
      - nnrf-disc # Nnrf_NFDiscovery service

  logger: # log output setting
    enable: true # true or false
    level: info # how detailed to output, value: trace, debug, info, warn, error, fatal, panic
    reportCaller: false # enable the caller report or not, value: true or false
amf:
  info:
    version: 1.0.9
    description: AMF initial local configuration

  configuration:
    idleTimeout: 60s # HTTP server idle timeout; 0s disables it
    readIdleTimeout: 60s # HTTP/2 client idle time before sending a health-check ping; 0s disables it
    pingTimeout: 15s # HTTP/2 health-check ping response timeout; 0s uses the transport default
    amfName: AMF # the name of this AMF
    ngapIpList:  # the IP list of N2 interfaces on this AMF
      - 127.0.0.18
    ngapPort: 38412 # the SCTP port listened by NGAP

    # Service-based Interface (SBI) Configuration
    sbi:
      scheme: http # the protocol for sbi (http or https)
      registerIPv4: 127.0.0.18 # IP used to register to NRF
      bindingIPv4: 127.0.0.18  # IP used to bind the service
      port: 8000 # port used to bind the service
      tls: # the local path of TLS key
        verify: false # Verify outgoing SBI HTTPS certificates
        pem: cert/amf.pem # AMF TLS Certificate
        key: cert/amf.key # AMF TLS Private key

    # SBI Services offered by this AMF, as per TS 29.518
    serviceNameList:
      - namf-comm # Namf_Communication service
      - namf-evts # Namf_EventExposure service
      - namf-mt   # Namf_MT service
      - namf-loc  # Namf_Location service
      - namf-oam  # OAM service
      - namf-callback # Namf_Callback service

    # Guami (Globally Unique AMF ID) list supported by this AMF
    servedGuamiList:
      # <GUAMI> = <MCC><MNC><AMF ID>
      - plmnId: # Public Land Mobile Network ID, <PLMN ID> = <MCC><MNC>
          mcc: 208 # Mobile Country Code (3 digits string, digit: 0~9)
          mnc: 93 # Mobile Network Code (2 or 3 digits string, digit: 0~9)
        amfId: cafe00 # AMF identifier (3 bytes hex string, range: 000000~FFFFFF)

    # the TAI (Tracking Area Identifier) list supported by this AMF
    supportTaiList:
      - plmnId: # Public Land Mobile Network ID, <PLMN ID> = <MCC><MNC>
          mcc: 208 # Mobile Country Code (3 digits string, digit: 0~9)
          mnc: 93 # Mobile Network Code (2 or 3 digits string, digit: 0~9)
        tac: 000001 # Tracking Area Code (3 bytes hex string, range: 000000~FFFFFF)

    # the PLMNs (Public land mobile network) list supported by this AMF
    plmnSupportList:
      - plmnId: # Public Land Mobile Network ID, <PLMN ID> = <MCC><MNC>
          mcc: 208 # Mobile Country Code (3 digits string, digit: 0~9)
          mnc: 93 # Mobile Network Code (2 or 3 digits string, digit: 0~9)
        snssaiList: # the S-NSSAI (Single Network Slice Selection Assistance Information) list supported by this AMF
          - sst: 1 # Slice/Service Type (uinteger, range: 0~255)
            sd: 010203 # Slice Differentiator (3 bytes hex string, range: 000000~FFFFFF)
          - sst: 1 # Slice/Service Type (uinteger, range: 0~255)
            sd: 112233 # Slice Differentiator (3 bytes hex string, range: 000000~FFFFFF)

    # the DNN (Data Network Name) list supported by this AMF
    supportDnnList:
      - internet
    nrfUri: http://127.0.0.10:8000 # a valid URI of NRF
    nrfCertPem: cert/nrf.pem # NRF Certificate

    # NAS Security Configuration
    # the priority of integrity algorithms
    # the priority of ciphering algorithms
    security:
      integrityOrder:
        - NIA2
        # - NIA0
      cipheringOrder:
        - NEA0
        - NEA2

    # Network Name Information
    networkName:
      full: free5GC
      short: free

    # Optional NGAP Information Elements (IE)
    ngapIE:
      mobilityRestrictionList: # Mobility Restriction List IE, refer to TS 38.413
        enable: true # append this IE in related message or not
      maskedIMEISV: # Masked IMEISV IE, refer to TS 38.413
        enable: true # append this IE in related message or not
      redirectionVoiceFallback: # Redirection Voice Fallback IE, refer to TS 38.413
        enable: false # append this IE in related message or not

    # Optional NAS Information Elements (IE)
    nasIE:
      networkFeatureSupport5GS: # 5gs Network Feature Support IE, refer to TS 24.501
        enable: true # append this IE in Registration accept or not
        length: 1 # IE content length (uinteger, range: 1~3)
        imsVoPS: 0 # IMS voice over PS session indicator (uinteger, range: 0~1)
        emc: 0 # Emergency service support indicator for 3GPP access (uinteger, range: 0~3)
        emf: 0 # Emergency service fallback indicator for 3GPP access (uinteger, range: 0~3)
        iwkN26: 0 # Interworking without N26 interface indicator (uinteger, range: 0~1)
        mpsi: 0 # MPS indicator (uinteger, range: 0~1)
        emcN3: 0 # Emergency service support indicator for Non-3GPP access (uinteger, range: 0~1)
        mcsi: 0 # MCS indicator (uinteger, range: 0~1)
    t3502Value: 720  # timer value (seconds) at UE side
    t3512Value: 3600 # timer value (seconds) at UE side
    non3gppDeregTimerValue: 3240 # timer value (seconds) at UE side
    # retransmission timer for paging message
    t3513:
      enable: true     # true or false
      expireTime: 6s   # default is 6 seconds
      maxRetryTimes: 4 # the max number of retransmission
    # retransmission timer for NAS Deregistration Request message
    t3522:
      enable: true     # true or false
      expireTime: 6s   # default is 6 seconds
      maxRetryTimes: 4 # the max number of retransmission
    # retransmission timer for NAS Registration Accept message
    t3550:
      enable: true     # true or false
      expireTime: 6s   # default is 6 seconds
      maxRetryTimes: 4 # the max number of retransmission
    # retransmission timer for NAS Configuration Update Command message
    t3555:
      enable: true     # true or false
      expireTime: 6s   # default is 6 seconds
      maxRetryTimes: 4 # the max number of retransmission
    # retransmission timer for NAS Authentication Request/Security Mode Command message
    t3560:
      enable: true     # true or false
      expireTime: 6s   # default is 6 seconds
      maxRetryTimes: 4 # the max number of retransmission
    # retransmission timer for NAS Notification message
    t3565:
      enable: true     # true or false
      expireTime: 6s   # default is 6 seconds
      maxRetryTimes: 4 # the max number of retransmission
    # retransmission timer for NAS Identity Request message
    t3570:
      enable: true     # true or false
      expireTime: 6s   # default is 6 seconds
      maxRetryTimes: 4 # the max number of retransmission
    locality: area1 # Name of the location where a set of AMF, SMF, PCF and UPFs are located

    # set the sctp server setting <optinal>, once this field is set, please also add maxInputStream, maxOsStream, maxAttempts, maxInitTimeOut
    sctp:
      numOstreams: 3 # the maximum out streams of each sctp connection
      maxInstreams: 5 # the maximum in streams of each sctp connection
      maxAttempts: 2 # the maximum attempts of each sctp connection
      maxInitTimeout: 2 # the maximum init timeout of each sctp connection
    defaultUECtxReq: false # the default value of UE Context Request to decide when triggering Initial Context Setup procedure

    ngapWorkerPoolSize: 0 # (int), default equal to runtime.NumCPU()
    ngapTaskBufferSize: 4096 # (int)

  logger: # log output setting
    enable: true # true or false
    level: info # how detailed to output, value: trace, debug, info, warn, error, fatal, panic
    reportCaller: false # enable the caller report or not, value: true or false
smf:
  info:
    version: 1.0.7
    description: SMF initial local configuration

  configuration:
    idleTimeout: 60s # HTTP server idle timeout; 0s disables it
    readIdleTimeout: 60s # HTTP/2 client idle time before sending a health-check ping; 0s disables it
    pingTimeout: 15s # HTTP/2 health-check ping response timeout; 0s uses the transport default
    smfName: SMF # the name of this SMF

    # Service-based interface information
    sbi:
      scheme: http # the protocol for sbi (http or https)
      registerIPv4: 127.0.0.2 # IP used to register to NRF
      bindingIPv4: 127.0.0.2 # IP used to bind the service
      port: 8000 # Port used to bind the service
      tls: # the local path of TLS key
        verify: false # Verify outgoing SBI HTTPS certificates
        key: cert/smf.key # SMF TLS Certificate
        pem: cert/smf.pem # SMF TLS Private key

    # the SBI services provided by this SMF, refer to TS 29.502
    serviceNameList:
      - nsmf-pdusession # Nsmf_PDUSession service
      - nsmf-event-exposure # Nsmf_EventExposure service
      - nsmf-oam # OAM service
      - nsmf-callback

    # the S-NSSAI (Single Network Slice Selection Assistance Information) list supported by this AMF
    snssaiInfos:
      - sNssai: # S-NSSAI (Single Network Slice Selection Assistance Information)
          sst: 1 # Slice/Service Type (uinteger, range: 0~255)
          sd: 010203 # Slice Differentiator (3 bytes hex string, range: 000000~FFFFFF)
        dnnInfos: # DNN information list
          - dnn: internet # Data Network Name
            dns: # the IP address of DNS
              ipv4: 8.8.8.8
              ipv6: 2001:4860:4860::8888
      - sNssai: # S-NSSAI (Single Network Slice Selection Assistance Information)
          sst: 1 # Slice/Service Type (uinteger, range: 0~255)
          sd: 112233 # Slice Differentiator (3 bytes hex string, range: 000000~FFFFFF)
        dnnInfos: # DNN information list
          - dnn: internet # Data Network Name
            dns: # the IP address of DNS
              ipv4: 8.8.8.8
              ipv6: 2001:4860:4860::8888

    # Optional: PLMN IDs configuration.
    plmnList:
      - mcc: 208 # Mobile Country Code (3 digits string, digit: 0~9)
        mnc: 93 # Mobile Network Code (2 or 3 digits string, digit: 0~9)
    locality: area1 # Name of the location where a set of AMF, SMF, PCF and UPFs are located

    # PFCP (Packet Forwarding Control Protocol) configuration for N4 interface.
    pfcp:
      # addr config is deprecated in smf config v1.0.3, please use the following config
      nodeID: 127.0.0.1 # the Node ID of this SMF
      listenAddr: 127.0.0.1 # the IP/FQDN of N4 interface on this SMF (PFCP)
      externalAddr: 127.0.0.1 # the IP/FQDN of N4 interface on this SMF (PFCP)
      assocFailAlertInterval: 10s
      assocFailRetryInterval: 30s
      heartbeatInterval: 10s

    # Userplane nodes information, specifying details for AN and UPF.
    userplaneInformation:
      upNodes: # information of userplane node (AN or UPF)
        gNB1: # the name of the node
          type: AN # the type of the node (AN or UPF)
        UPF: # the name of the node
          type: UPF # the type of the node (AN or UPF)
          nodeID: 127.0.0.8 # the Node ID of this UPF
          addr: 127.0.0.8 # the IP/FQDN of N4 interface on this UPF (PFCP)
          # Optional Nupf Event Exposure API root for this UPF.
          # SMF appends /nupf-ee/v1; do not include that service path here.
          # Enable only when this UPF exposes Nupf_EventExposure at this API root.
          # nupfEeApiRoot: http://upf.example.com:<nupf-ee-port>
          sNssaiUpfInfos: # S-NSSAI information list for this UPF
            - sNssai: # S-NSSAI (Single Network Slice Selection Assistance Information)
                sst: 1 # Slice/Service Type (uinteger, range: 0~255)
                sd: 010203 # Slice Differentiator (3 bytes hex string, range: 000000~FFFFFF)
              dnnUpfInfoList: # DNN information list for this S-NSSAI
                - dnn: internet
                  pools:
                    - cidr: 10.60.0.0/16
                  staticPools:
                    - cidr: 10.60.100.0/24
            - sNssai: # S-NSSAI (Single Network Slice Selection Assistance Information)
                sst: 1 # Slice/Service Type (uinteger, range: 0~255)
                sd: 112233 # Slice Differentiator (3 bytes hex string, range: 000000~FFFFFF)
              dnnUpfInfoList: # DNN information list for this S-NSSAI
                - dnn: internet
                  pools:
                    - cidr: 10.61.0.0/16
                  staticPools:
                    - cidr: 10.61.100.0/24
          # The IP address for the N3 interface must match the IP bound in the UPF N3 interface.
          # If UPF binds to a specific IP, set that same IP here.
          # If UPF binds to all IPs (0.0.0.0), you can set any of the available UPF IPs here.
          # Do NOT set 0.0.0.0 as this is not a valid routable address.
          interfaces: # Interface list for this UPF
            - interfaceType: N3 # the type of the interface (N3 or N9)
              endpoints: # the IP address of this N3/N9 interface on this UPF
                - 127.0.0.8
              networkInstances: # Data Network Name (DNN)
                - internet

      # the topology graph of userplane, A and B represent the two nodes of each link
      links:
        - A: gNB1
          B: UPF

    # retransmission timer for PDU session modification command
    t3591:
      enable: true # true or false
      expireTime: 16s # default is 6 seconds
      maxRetryTimes: 3 # the max number of retransmission

    # retransmission timer for PDU session release command
    t3592:
      enable: true # true or false
      expireTime: 16s # default is 6 seconds
      maxRetryTimes: 3 # the max number of retransmission

    nrfUri: http://127.0.0.10:8000 # a valid URI of NRF
    nrfCertPem: cert/nrf.pem # NRF Certificate
    urrPeriod: 30 # default usage report period in seconds
    urrThreshold: 500000 # default usage report threshold in bytes
    requestedUnit: 1000

  # Logging Configuration
  logger:
    enable: true # true or false
    level: info # how detailed to output, value: trace, debug, info, warn, error, fatal, panic
    reportCaller: false # enable the caller report or not, value: true or false
udr:
  info:
    version: 1.1.0
    description: UDR initial local configuration

  configuration:
    idleTimeout: 60s # HTTP server idle timeout; 0s disables it
    readIdleTimeout: 60s # HTTP/2 client idle time before sending a health-check ping; 0s disables it
    pingTimeout: 15s # HTTP/2 health-check ping response timeout; 0s uses the transport default
    sbi: # Service-based interface information
      scheme: http # the protocol for sbi (http or https)
      registerIPv4: 127.0.0.4 # IP used to register to NRF
      bindingIPv4: 127.0.0.4  # IP used to bind the service
      port: 8000 # port used to bind the service
      tls: # the local path of TLS key
        verify: false # Verify outgoing SBI HTTPS certificates
        pem: cert/udr.pem # UDR TLS Certificate
        key: cert/udr.key # UDR TLS Private key
    dbConnectorType: mongodb
    mongodb:
      name: free5gc # Database name in MongoDB
      url: mongodb://localhost:27017 # URL of MongoDB
    nrfUri: http://127.0.0.10:8000 # a valid URI of NRF
    nrfCertPem: cert/nrf.pem # NRF Certificate

  logger: # log output setting
    enable: true # true or false
    level: info # how detailed to output, value: trace, debug, info, warn, error, fatal, panic
    reportCaller: false # enable the caller report or not, value: true or false
pcf:
  info:
    version: 1.0.2
    description: PCF initial local configuration

  configuration:
    idleTimeout: 60s # HTTP server idle timeout; 0s disables it
    readIdleTimeout: 60s # HTTP/2 client idle time before sending a health-check ping; 0s disables it
    pingTimeout: 15s # HTTP/2 health-check ping response timeout; 0s uses the transport default
    pcfName: PCF # the name of this PCF
    sbi: # Service-based interface information
      scheme: http # the protocol for sbi (http or https)
      registerIPv4: 127.0.0.7 # IP used to register to NRF
      bindingIPv4: 127.0.0.7  # IP used to bind the service
      port: 8000              # port used to bind the service
      tls: # the local path of TLS key
        verify: false # Verify outgoing SBI HTTPS certificates
        pem: cert/pcf.pem # PCF TLS Certificate
        key: cert/pcf.key # PCF TLS Private key
    timeFormat: 2019-01-02 15:04:05 # time format of this PCF
    defaultBdtRefId: BdtPolicyId-   # BDT Reference ID, indicating transfer policies of background data transfer.
    nrfUri: http://127.0.0.10:8000  # a valid URI of NRF
    nrfCertPem: cert/nrf.pem # NRF Certificate
    bsf:
      enable: true  # Enable BSF integration (set to false to disable BSF completely)
    serviceList:   # the SBI services provided by this PCF, refer to TS 29.507
      - serviceName: npcf-am-policy-control # Npcf_AMPolicyControl service
      - serviceName: npcf-smpolicycontrol   # Npcf_SMPolicyControl service
        suppFeat: 3fff # the features supported by Npcf_SMPolicyControl, name defined in TS 29.512 5.8-1, value defined in TS 29.571 5.2.2
      - serviceName: npcf-bdtpolicycontrol    # Npcf_BDTPolicyControl service
      - serviceName: npcf-policyauthorization # Npcf_PolicyAuthorization service
        suppFeat: 3    # the features supported by Npcf_PolicyAuthorization, name defined in TS 29.514 5.8-1, value defined in TS 29.571 5.2.2
      - serviceName: npcf-eventexposure       # Npcf_EventExposure service
      - serviceName: npcf-ue-policy-control   # Npcf_UEPolicyControl service
      - serviceName: npcf-callback            # Npcf callback service
    mongodb:       # the mongodb connected by this PCF
      name: free5gc                  # name of the mongodb
      url: mongodb://localhost:27017 # a valid URL of the mongodb
    locality: area1 # Name of the location where a set of AMF, SMF, PCF and UPFs are located

  logger: # log output setting
    enable: true # true or false
    level: info # how detailed to output, value: trace, debug, info, warn, error, fatal, panic
    reportCaller: false # enable the caller report or not, value: true or false
udm:
  info:
    version: 1.0.3
    description: UDM initial local configuration

  configuration:
    idleTimeout: 60s # HTTP server idle timeout; 0s disables it
    readIdleTimeout: 60s # HTTP/2 client idle time before sending a health-check ping; 0s disables it
    pingTimeout: 15s # HTTP/2 health-check ping response timeout; 0s uses the transport default
    serviceNameList: # the SBI services provided by this UDM, refer to TS 29.503
      - nudm-sdm # Nudm_SubscriberDataManagement service
      - nudm-uecm # Nudm_UEContextManagement service
      - nudm-ueau # Nudm_UEAuthenticationManagement service
      - nudm-ee # Nudm_EventExposureManagement service
      - nudm-pp # Nudm_ParameterProvisionDataManagement service
    sbi: # Service-based interface information
      scheme: http # the protocol for sbi (http or https)
      registerIPv4: 127.0.0.3 # IP used to register to NRF
      bindingIPv4: 127.0.0.3  # IP used to bind the service
      port: 8000 # Port used to bind the service
      tls: # the local path of TLS key
        verify: false # Verify outgoing SBI HTTPS certificates
        pem: cert/udm.pem # UDM TLS Certificate
        key: cert/udm.key # UDM TLS Private key
    nrfUri: http://127.0.0.10:8000 # a valid URI of NRF
    nrfCertPem: cert/nrf.pem # NRF Certificate

    # test data set from TS33501-f60 Annex C.4
    SuciProfile: # Home Network Public Key ID = slice index +1
      - ProtectionScheme: 1 # Protect Scheme: Profile A
        PrivateKey: c53c22208b61860b06c62e5406a7b330c2b577aa5558981510d128247d38bd1d
        PublicKey: 5a8d38864820197c3394b92613b20b91633cbd897119273bf8e4a6f4eec0a650
      - ProtectionScheme: 2 # Protect Scheme: Profile B
        PrivateKey: F1AB1074477EBCC7F554EA1C5FC368B1616730155E0041AC447D6301975FECDA
        PublicKey: 0472DA71976234CE833A6907425867B82E074D44EF907DFB4B3E21C1C2256EBCD15A7DED52FCBB097A4ED250E036C7B9C8C7004C4EEDC4F068CD7BF8D3F900E3B4

  logger: # log output setting
    enable: true # true or false
    level: info # how detailed to output, value: trace, debug, info, warn, error, fatal, panic
    reportCaller: false # enable the caller report or not, value: true or false
nssf:
  info:
    version: 1.0.2
    description: NSSF initial local configuration

  configuration:
    idleTimeout: 60s # HTTP server idle timeout; 0s disables it
    readIdleTimeout: 60s # HTTP/2 client idle time before sending a health-check ping; 0s disables it
