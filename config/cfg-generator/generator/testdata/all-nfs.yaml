      - serviceName: nudm-sdm
      - serviceName: nudr-dr
    amfUri: http://127.0.0.18:8000
    ausfUri: http://127.0.0.9:8000
    chfUri: http://127.0.0.113:8000
    nefUri: http://127.0.0.5:8000
    nssfUri: http://127.0.0.31:8000
    pcfUri: http://127.0.0.7:8000
    smfUri: http://127.0.0.2:8000
    udmUri: http://127.0.0.3:8000
    udrUri: http://127.0.0.4:8000
    upfUri: http://127.0.0.8:8000

  logger:
    enable: true
    level: info
    reportCaller: false
bsf:
  info:
    version: 1.0.0
    description: BSF initial local configuration

  configuration:
    idleTimeout: 60s # HTTP server idle timeout; 0s disables it
    readIdleTimeout: 60s # HTTP/2 client idle time before sending a health-check ping; 0s disables it
    pingTimeout: 15s # HTTP/2 health-check ping response timeout; 0s uses the transport default
    bsfName: BSF # the name of this BSF
    sbi: # Service-based interface information
      scheme: http # the protocol for sbi (http or https)
      registerIPv4: 127.0.0.15 # IP used to register to NRF
      bindingIPv4: 127.0.0.15  # IP used to bind the service
      port: 8000 # Port used to bind the service
      tls: # the local path of TLS key
        verify: false # Verify outgoing SBI HTTPS certificates
        pem: cert/bsf.pem # BSF TLS Certificate
        key: cert/bsf.key # BSF TLS Private key
    nrfUri: http://127.0.0.10:8000 # a valid URI of NRF
    nrfCertPem: cert/nrf.pem # NRF Certificate
    mongodb:
      name: free5gc                      # name of the mongodb
      url: mongodb://127.0.0.1:27017     # a valid URL of the mongodb
    metrics: # BSF metrics configuration
      enable: true                      # enable/disable metrics server
      scheme: http                       # the protocol for metrics server (http or https)
      bindingIPv4: 0.0.0.0               # IP used to bind the metrics server
      port: 9091                         # Port used to bind the metrics server
      namespace: free5gc                 # metrics namespace
      tls:                               # TLS configuration for metrics server (if https)
        pem: cert/bsf.pem                # BSF TLS Certificate for metrics
        key: cert/bsf.key                # BSF TLS Private key for metrics

  logger: # log output setting
    enable: true # true or false
    level: info # how detailed to output, value: trace, debug, info, warn, error, fatal, panic
    reportCaller: false # enable the caller report or not, value: true or false
n3iwf:
  info:
    version: 1.0.5
    description: N3IWF initial local configuration

  configuration:
    idleTimeout: 60s # HTTP server idle timeout; 0s disables it
    n3iwfInformation:
      globalN3IWFID: # ID used to globally identify an N3IWF
        plmnID: # Public Land Mobile Network ID, <PLMN ID> = <MCC><MNC>
          mcc: 208 # Mobile Country Code (3 digits string, digit: 0~9)
          mnc: 93 # Mobile Network Code (2 or 3 digits string, digit: 0~9)
        n3iwfID: 135 # ID used to identify an N3IWF in PLMN (uinteger, range: 0~65535)
      name: free5GC_N3IWF # The name of this N3IWF
      supportedTAList: # Tracking Area supported by this N3IWF
        - tac: 000001 # Tracking Area Code (3 bytes hex string, range: 000000~FFFFFF)
          broadcastPlmnList: # Refer to TS 38.413
            - plmnID: # Public Land Mobile Network ID
                mcc: 208 # Mobile Country Code (3 digits string, digit: 0~9)
                mnc: 93 # Mobile Network Code (2 or 3 digits string, digit: 0~9)
              taiSliceSupportList: # Network Slice supported in this TAI
                - snssai: # Single Network Slice Selection Assistance Information
                    sst: 1 # Slice/Service Type (1 byte hex string, range: 0~F)
                    sd: 010203 # Slice Differentiator (3 bytes hex string, range: 000000~FFFFFF)
                - snssai: # Single Network Slice Selection Assistance Information
                    sst: 1 # Slice/Service Type (1 byte hex string, range: 0~F)
                    sd: 112233 # Slice Differentiator (3 bytes hex string, range: 000000~FFFFFF)

    # --- N2 Interfaces ---
    amfSCTPAddresses: # the IP list of N2 interfaces (SCTP) on AMF when using NGAP
      - ip:
          - 127.0.0.18
        port: 38412
    nasTcpPort: 20000 # TCP port which the NAS listens on

    # --- Nwu Interfaces ---
    ikeBindAddress: 172.16.2.100 # Nwu interface  IP address (IKE) on this N3IWF
    ipSecTunnelAddress: 10.0.0.1 # Tunnel IP address of XFRM interface on this N3IWF
    ueIpAddressRange: 10.0.0.0/24 # IP address pool allocated to UE in IPSec tunnel
    xfrmInterfaceName: xfrmi # Prefix of XFRM interface name created by N3IWF
    xfrmInterfaceID: 1 # XFRM interface if_id for IPSec routing (Any value except to 0, default value is 7 if not defined)

    # --- N3 Interfaces ---
    n3iwfGtpBindAddress: 127.0.0.33 # IP address of N3 interface (GTP) on this N3IWF

    fqdn: n3iwf.free5gc.org # FQDN of this N3IWF

    # --- Security ---
    privateKey: cert/n3iwf.key # Private key file path
    certificateAuthority: cert/n3iwf.pem # Certificate Authority (CA) file path
    certificate: cert/n3iwf.pem # Certificate file path

    # sending dead peer detection message
    livenessCheck:
      enable: true # true or false
      transFreq: 60s # frequency of transmission
      maxRetryTimes: 4 # the max number of DPD response of UE

  logger: # log output setting
    enable: true # true or false
    level: info # how detailed to output, value: trace, debug, info, warn, error, fatal, panic
    reportCaller: false # enable the caller report or not, value: true or false
tngf:
  info:
    version: 1.0.3
    description: TNGF initial local configuration

  configuration:
    idleTimeout: 60s # HTTP server idle timeout; 0s disables it
    TNGFInformation:
      GlobalTNGFID: # ID used to globally identify an TNGF
        PLMNID: # Public Land Mobile Network ID, <PLMN ID> = <MCC><MNC>
          MCC: 208 # Mobile Country Code (3 digits string, digit: 0~9)
          MNC: 93 # Mobile Network Code (2 or 3 digits string, digit: 0~9)
        TNGFID: 135 # ID used to identify an TNGF in PLMN (uinteger, range: 0~65535)
      Name: free5GC_TNGF # The name of this TNGF
      SupportedTAList: # Tracking Area supported by this TNGF
        - TAC: 000001 # Tracking Area Code (3 bytes hex string, range: 000000~FFFFFF)
          BroadcastPLMNList: # Refer to TS 38.413
            - PLMNID: # Public Land Mobile Network ID
                MCC: 208 # Mobile Country Code (3 digits string, digit: 0~9)
                MNC: 93 # Mobile Network Code (2 or 3 digits string, digit: 0~9)
              TAISliceSupportList: # Network Slice supported in this TAI
                - SNSSAI: # Single Network Slice Selection Assistance Information
                    SST: 1 # Slice/Service Type (1 byte hex string, range: 0~F)
                    SD: 010203 # Slice Differentiator (3 bytes hex string, range: 000000~FFFFFF)
                - SNSSAI: # Single Network Slice Selection Assistance Information
                    SST: 1 # Slice/Service Type (1 byte hex string, range: 0~F)
                    SD: 112233 # Slice Differentiator (3 bytes hex string, range: 000000~FFFFFF)

    AMFSCTPAddresses: # the IP list of N2 interfaces (SCTP) on AMF when using NGAP
      - IP:
          - 127.0.0.18
        Port: 38412
    NASTCPPort: 20000 # TCP port which the NAS listens on

    # --- Bind Interfaces ---
    IKEBindAddress: 192.168.1.102  # IP address of Nwu interface (IKE) on this TNGF
    RadiusBindAddress: 192.168.1.102 # IP address of Nwu interface (IKE) on this TNGF
    IPSecInterfaceAddress: 10.0.0.1 # IP address of IPSec virtual interface (IPsec tunnel enpoint on this TNGF)
    IPSecTunnelAddress: 10.0.0.1 # Tunnel IP address of XFRM interface on this TNGF
    UEIPAddressRange: 10.0.0.0/24 # IP address allocated to UE in IPSec tunnel
    XFRMInterfaceName: xfrmi # Prefix of XFRM interface name created by TNGF
    XFRMInterfaceID: 1 # XFRM interface if_id for IPSec routing (Any value except to 0, default value is 7 if not defined)

    # --- N3 Interfaces ---
    GTPBindAddress: 127.0.0.33 # IP address of N3 interface (GTP) on this TNGF

    FQDN: tngf.free5gc.org # FQDN of this TNGF

    # --- Security ---
    PrivateKey: cert/tngf.key # Private key file path
    CertificateAuthority: cert/tngf.pem # Certificate Authority (CA) file path
    Certificate: cert/tngf.pem # Certificate file path
    RadiusSecret: free5gctngf

  # the kind of log output
  # debugLevel: how detailed to output, value: trace, debug, info, warn, error, fatal, panic
  # ReportCaller: enable the caller report or not, value: true or false
  logger:
    enable: true # true or false
    level: info # how detailed to output, value: trace, debug, info, warn, error, fatal, panic
    reportCaller: false # enable the caller report or not, value: true or false
